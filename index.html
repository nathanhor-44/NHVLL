<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Nathan Horville</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =========================
           VARIABLES
        ========================= */

        :root {
            --primary: #2C3E50;
            --accent: #E74C3C;
            --dark: #1a1a1a;
            --gray: #555;
            --gray-light: #ecf0f1;
        }

        /* =========================
           PAGE
        ========================= */

        @page {
            size: A4;
            margin: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f5f5f5;
            padding: 20px;
            line-height: 1.4;
        }

        /* =========================
           LAYOUT
        ========================= */

        .container {
            width: 210mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
        }

        .sidebar {
            width: 240px;
            min-width: 240px;
            background: var(--primary);
            color: white;
            padding: 22px;
        }

        .main-content {
            flex: 1;
            padding: 22px 28px;
            background: white;
        }

        /* =========================
           PROFILE
        ========================= */

        .profile-section {
            margin-bottom: 25px;
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 12px;
            opacity: 0.9;
            font-weight: 300;
        }

        /* =========================
           TITRES
        ========================= */

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin: 14px 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
        }

        .content-section-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
            font-size: 11px;
        }

        .contact-icon {
            margin-right: 8px;
            min-width: 16px;
        }

        /* =========================
           SKILLS
        ========================= */

        .skills-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skill-item {
            font-size: 12px;
        }

        .skill-bar {
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .skill-level {
            height: 100%;
            background: var(--accent);
        }

        /* =========================
           EXPERIENCE
        ========================= */

        .experience-item {
            margin-bottom: 11px;
            padding-left: 18px;
            border-left: 2px solid var(--gray-light);
            position: relative;
        }

        .experience-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 4px;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="profile-section">
            <h1 class="name">Nathan<br>Horville</h1>
            <p class="subtitle">08/04/2008 (17 ans) | Terminale CIEL</p>
            <p class="subtitle">Recherche alternance</p>
        </div>

        <h2 class="section-title">Contact</h2>

        <div class="contact-item">
            <span class="contact-icon">📍</span>
            <span>
                29 la Graffinière<br>
                44160 Besné, France
            </span>
        </div>

        <div class="contact-item">
            <span class="contact-icon">📞</span>
            <span>07 61 70 29 23</span>
        </div>

        <div class="contact-item">
            <span class="contact-icon">✉️</span>
            <span>
                <a href="mailto:nathanhor44@gmail.com">nathanhor44@gmail.com</a>
            </span>
        </div>

    </aside>

</div>

</body>
</html>
